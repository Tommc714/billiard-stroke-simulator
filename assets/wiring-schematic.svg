<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 140 1600 900" role="img" aria-label="Point-to-point wiring from each component pin to the Pi GPIO hole">
  <style>
    text { font-family: "Segoe UI", system-ui, sans-serif; }
    .h { font-size: 14px; font-weight: 700; fill: #1e293b; }
    .p { font-size: 12px; fill: #334155; }
    .s { font-size: 11px; fill: #64748b; }
    .pin { font-size: 12px; font-weight: 600; fill: #1e293b; }
    .w5 { stroke: #e24b4b; stroke-width: 2; fill: none; }
    .w33 { stroke: #e89a3c; stroke-width: 2; fill: none; }
    .wg { stroke: #8b95a0; stroke-width: 2; fill: none; }
    .wi { stroke: #4c9adf; stroke-width: 2; fill: none; }
    .wscl { stroke: #2a9a8a; stroke-width: 2; fill: none; }
    .we { stroke: #3cbe7a; stroke-width: 2; fill: none; }
    .wm { stroke: #a78bfa; stroke-width: 2; fill: none; }
    .wy { stroke: #e8c547; stroke-width: 2; fill: none; }
    .wp { stroke: #9aa3ad; stroke-width: 3; fill: none; }
  </style>
  <defs>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 z" fill="#e24b4b"/></marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 z" fill="#e89a3c"/></marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 z" fill="#8b95a0"/></marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 z" fill="#4c9adf"/></marker>
    <marker id="arr-cyan" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 z" fill="#2a9a8a"/></marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 z" fill="#3cbe7a"/></marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 z" fill="#a78bfa"/></marker>
    <marker id="arr-yellow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 z" fill="#e8c547"/></marker>
  </defs>

  <rect x="0" y="140" width="1600" height="900" fill="#ffffff"/>
  <text class="h" x="28" y="168">Billiard Stroke Simulator — wiring (print)</text>

  <g>
    <rect x="28" y="186" width="360" height="210" rx="8" fill="#ffffff" stroke="#64748b"/>
    <text class="h" x="44" y="210">Taiss E38S6-600-24G</text>
    <text class="s" x="44" y="226">NPN open-collector encoder</text>
    <text class="pin" x="44" y="252">Red VCC</text>
    <text class="p" x="150" y="252">pin 2   5 V</text>
    <text class="pin" x="44" y="274">Black 0V</text>
    <text class="p" x="150" y="274">pin 9   GND</text>
    <text class="pin" x="44" y="296">White A</text>
    <text class="p" x="150" y="296">pin 11  GPIO17</text>
    <text class="pin" x="44" y="318">Green B</text>
    <text class="p" x="150" y="318">pin 13  GPIO27</text>
    <text class="p" x="44" y="350">1.5 kOhm tees A and B to pin 1 (3.3 V).</text>
    <text class="p" x="44" y="368">Not in series. Do not pull A or B up to 5 V.</text>
  </g>
  <circle cx="255" cy="248" r="4.5" fill="#e24b4b"/>
  <circle cx="248" cy="270" r="4.5" fill="#8b95a0"/>
  <circle cx="276" cy="292" r="4.5" fill="#3cbe7a"/>
  <circle cx="276" cy="314" r="4.5" fill="#3cbe7a"/>

  <g>
    <rect x="28" y="416" width="360" height="150" rx="8" fill="#ffffff" stroke="#64748b"/>
    <text class="h" x="44" y="440">UCTRONICS OLED 128x64</text>
    <text class="s" x="44" y="456">I2C address 0x3C</text>
    <text class="pin" x="44" y="482">VCC</text>
    <text class="p" x="150" y="482">pin 1   3.3 V</text>
    <text class="pin" x="44" y="504">GND</text>
    <text class="p" x="150" y="504">pin 25  GND</text>
    <text class="pin" x="44" y="526" fill="#4c9adf">SDA</text>
    <text class="p" x="150" y="526">pin 3   SDA</text>
    <text class="pin" x="44" y="548" fill="#2a9a8a">SCL</text>
    <text class="p" x="150" y="548">pin 5   SCL</text>
  </g>
  <circle cx="255" cy="478" r="4.5" fill="#e89a3c"/>
  <circle cx="255" cy="500" r="4.5" fill="#8b95a0"/>
  <circle cx="248" cy="522" r="4.5" fill="#4c9adf"/>
  <circle cx="248" cy="544" r="4.5" fill="#2a9a8a"/>

  <g>
    <rect x="28" y="586" width="360" height="200" rx="8" fill="#ffffff" stroke="#4c9adf"/>
    <text class="h" x="44" y="610">ADS1115 ADC</text>
    <text class="s" x="44" y="626">I2C address 0x48. Power at 3.3 V only.</text>
    <text class="pin" x="44" y="652">VDD</text>
    <text class="p" x="150" y="652">pin 17  3.3 V</text>
    <text class="pin" x="44" y="674">GND</text>
    <text class="p" x="150" y="674">pin 25  GND</text>
    <text class="pin" x="44" y="696" fill="#4c9adf">SDA</text>
    <text class="p" x="150" y="696">pin 3   same wire as OLED</text>
    <text class="pin" x="44" y="718" fill="#2a9a8a">SCL</text>
    <text class="p" x="150" y="718">pin 5   same wire as OLED</text>
    <text class="pin" x="44" y="740">ADDR</text>
    <text class="p" x="150" y="740">to GND, or leave empty</text>
    <text class="pin" x="44" y="762">A0</text>
    <text class="p" x="150" y="762">to knob middle pin</text>
  </g>
  <circle cx="255" cy="648" r="4.5" fill="#e89a3c"/>
  <circle cx="255" cy="670" r="4.5" fill="#8b95a0"/>
  <circle cx="345" cy="692" r="4.5" fill="#4c9adf"/>
  <circle cx="345" cy="714" r="4.5" fill="#2a9a8a"/>
  <circle cx="318" cy="736" r="4.5" fill="#8b95a0"/>
  <circle cx="290" cy="758" r="4.5" fill="#3cbe7a"/>

  <g>
    <rect x="28" y="806" width="360" height="100" rx="8" fill="#ffffff" stroke="#64748b"/>
    <text class="h" x="44" y="830">B10K linear knob</text>
    <text class="pin" x="44" y="854">Outer</text>
    <text class="p" x="150" y="854">pin 25  GND</text>
    <text class="pin" x="44" y="876">Middle</text>
    <text class="p" x="150" y="876">ADS1115 A0</text>
    <text class="pin" x="44" y="896">Outer</text>
    <text class="p" x="150" y="896">pin 17  3.3 V  (not 5 V)</text>
  </g>
  <circle cx="255" cy="850" r="4.5" fill="#8b95a0"/>
  <circle cx="248" cy="872" r="4.5" fill="#3cbe7a"/>
  <circle cx="318" cy="892" r="4.5" fill="#e89a3c"/>


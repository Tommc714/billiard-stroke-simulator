  <g>
    <rect x="990" y="456" width="280" height="88" rx="8" fill="#ffffff" stroke="#64748b"/>
    <text class="h" x="1008" y="480">DC motor</text>
    <text class="p" x="1008" y="502">Red to H-bridge M+</text>
    <text class="p" x="1008" y="522">Black to H-bridge M-</text>
  </g>
  <g>
    <rect x="1292" y="456" width="280" height="88" rx="8" fill="#ffffff" stroke="#64748b"/>
    <text class="h" x="1310" y="480">3-24 V motor supply</text>
    <text class="p" x="1310" y="502">+ to H-bridge B+</text>
    <text class="p" x="1310" y="522">- to H-bridge B- and common GND</text>
  </g>

  <g>
    <rect x="990" y="564" width="582" height="56" rx="8" fill="#ffffff" stroke="#64748b"/>
    <text class="h" x="1008" y="586">Official USB-C 5 V</text>
    <text class="p" x="1200" y="586">to Pi USB-C only. Not the H-bridge or motor.</text>
  </g>

  <g>
    <rect x="990" y="640" width="582" height="128" rx="8" fill="#ffffff" stroke="#64748b"/>
    <text class="h" x="1008" y="664">Fire / Home  (normally-open buttons)</text>
    <text class="pin" x="1008" y="688">FIRE GPIO</text><text class="p" x="1200" y="688">pin 16  GPIO23</text>
    <text class="pin" x="1008" y="710">FIRE GND</text><text class="p" x="1200" y="710">pin 14  GND</text>
    <text class="pin" x="1008" y="732">HOME GPIO</text><text class="p" x="1200" y="732">pin 18  GPIO24</text>
    <text class="pin" x="1008" y="754">HOME GND</text><text class="p" x="1200" y="754">pin 20  GND</text>
  </g>
  <circle cx="990" cy="684" r="4.5" fill="#e8c547"/>
  <circle cx="990" cy="706" r="4.5" fill="#8b95a0"/>
  <circle cx="990" cy="728" r="4.5" fill="#e8c547"/>
  <circle cx="990" cy="750" r="4.5" fill="#8b95a0"/>

  <g>
    <rect x="990" y="780" width="582" height="40" rx="8" fill="#ffffff" stroke="#64748b"/>
    <text class="s" x="1008" y="804">Later: H-bridge R_IS / L_IS to ADS1115 A1 / A2. Bluetooth stays in the box. Pin 15 empty.</text>
  </g>


      <text x="648" y="278" text-anchor="end">SDA</text><text x="718" y="278">5V fan</text>
      <text x="648" y="300" text-anchor="end">SCL</text><text x="718" y="300">GND fan</text>
      <text x="648" y="344" text-anchor="end">GND</text>
      <text x="648" y="366" text-anchor="end">GPIO17</text>
      <text x="648" y="388" text-anchor="end">GPIO27</text><text x="718" y="388">GND</text>
      <text x="718" y="410">GPIO23</text>
      <text x="648" y="432" text-anchor="end">3V3</text><text x="718" y="432">GPIO24</text>
      <text x="718" y="454">GND</text>
      <text x="648" y="520" text-anchor="end">GND</text>
      <text x="718" y="586">PWM0</text>
      <text x="648" y="608" text-anchor="end">PWM1</text>
      <text x="718" y="630">GPIO16</text>
      <text x="648" y="652" text-anchor="end">GPIO26</text>
      <text x="648" y="674" text-anchor="end">GND</text>

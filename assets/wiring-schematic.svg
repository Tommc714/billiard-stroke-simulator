  <g>
    <rect x="990" y="186" width="582" height="250" rx="8" fill="#ffffff" stroke="#64748b"/>
    <text class="h" x="1008" y="210">IBT-2 / BTS7960 H-bridge</text>
    <text class="s" x="1008" y="226">Logic at 3.3 V. Motor power is the other pair of terminals.</text>
    <text class="pin" x="1008" y="252">VCC</text><text class="p" x="1120" y="252">pin 1   3.3 V</text>
    <text class="pin" x="1008" y="274">GND</text><text class="p" x="1120" y="274">pin 39  GND</text>
    <text class="pin" x="1008" y="296">RPWM</text><text class="p" x="1120" y="296">pin 32  GPIO12</text>
    <text class="pin" x="1008" y="318">LPWM</text><text class="p" x="1120" y="318">pin 33  GPIO13</text>
    <text class="pin" x="1008" y="340">R_EN</text><text class="p" x="1120" y="340">pin 36  GPIO16</text>
    <text class="pin" x="1008" y="362">L_EN</text><text class="p" x="1120" y="362">pin 37  GPIO26</text>
    <text class="pin" x="1008" y="388">B+ / B-</text><text class="p" x="1120" y="388">to 3-24 V bench supply  (6 V or higher)</text>
    <text class="pin" x="1008" y="410">M+ / M-</text><text class="p" x="1120" y="410">to motor red / black</text>
  </g>
  <circle cx="990" cy="248" r="4.5" fill="#e89a3c"/>
  <circle cx="990" cy="270" r="4.5" fill="#8b95a0"/>

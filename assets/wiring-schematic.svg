  <text class="h" x="28" y="1004">COMMON GROUND -- Pi, encoder, OLED, ADS1115, H-bridge, and motor-supply minus</text>
  <text class="s" x="28" y="1024">Dots start after the pin text. Arrows stop at the GPIO name. No e-stop. Fire and Home are wired now.</text>
